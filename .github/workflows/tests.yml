name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring, ctype, xmlreader
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      # PHP 8.5 is not a stable release yet, so let dev dependencies that
      # do not declare support for it install anyway.
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.php == '8.5' && '--ignore-platform-req=php+' || '' }}

      - name: Run tests
        run: vendor/bin/phpunit tests
